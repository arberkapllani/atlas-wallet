[package]
name = "exodus2-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Exodus 2 desktop application (Tauri shell)"

[[bin]]
name = "exodus2-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"

exodus2-wallet-core = { workspace = true }
exodus2-chain-traits = { workspace = true }
exodus2-chain-bitcoin = { workspace = true }
exodus2-chain-evm = { workspace = true }
exodus2-price-oracle = { workspace = true }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
