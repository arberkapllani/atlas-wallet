[package]
name = "atlas-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Atlas desktop application (Tauri shell)"

[[bin]]
name = "atlas-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }

tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"

atlas-wallet-core = { workspace = true }
atlas-chain-traits = { workspace = true }
atlas-chain-bitcoin = { workspace = true }
atlas-chain-evm = { workspace = true }
atlas-chain-solana = { workspace = true }
atlas-chain-tron = { workspace = true }
atlas-chain-cosmos = { workspace = true }
atlas-chain-cardano = { workspace = true }
atlas-chain-utxo = { workspace = true }
atlas-price-oracle = { workspace = true }
atlas-profile = { workspace = true }
atlas-settings = { workspace = true }
atlas-token-registry = { workspace = true }
atlas-nft-registry = { workspace = true }
atlas-biometric = { workspace = true }
atlas-exchange-1inch = { workspace = true }
atlas-exchange-jupiter = { workspace = true }
atlas-exchange-thorchain = { workspace = true }
atlas-exchange-changenow = { workspace = true }
atlas-exchange-router = { workspace = true }
atlas-onramp = { workspace = true }
atlas-multisig-btc = { workspace = true }
atlas-multisig-evm = { workspace = true }
atlas-aa-erc4337 = { workspace = true }
atlas-shamir = { workspace = true }
atlas-walletconnect = { workspace = true }
atlas-dapp-registry = { workspace = true }
uuid = { workspace = true }

specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
sqlx = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.10"

