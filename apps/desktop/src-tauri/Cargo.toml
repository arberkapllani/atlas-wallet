[package]
name = "atlas-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Atlas desktop application (Tauri shell)"

[[bin]]
name = "atlas-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"

atlas-wallet-core = { workspace = true }
atlas-chain-traits = { workspace = true }
atlas-chain-bitcoin = { workspace = true }
atlas-chain-evm = { workspace = true }
atlas-chain-solana = { workspace = true }
atlas-chain-tron = { workspace = true }
atlas-price-oracle = { workspace = true }
atlas-profile = { workspace = true }
atlas-token-registry = { workspace = true }
uuid = { workspace = true }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

