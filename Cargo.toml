[workspace]
resolver = "2"
members = [
    "crates/wallet-core",
    "crates/chain-traits",
    "crates/chain-bitcoin",
    "crates/chain-evm",
    "crates/chain-solana",
    "crates/chain-tron",
    "crates/chain-cosmos",
    "crates/chain-cardano",
    "crates/chain-utxo",
    "crates/price-oracle",
    "crates/profile",
    "crates/settings",
    "crates/token-registry",
    "crates/nft-registry",
    "crates/hardware-ledger",
    "crates/exchange-1inch",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Atlas Contributors"]
repository = "https://github.com/arberkapllani/atlas-wallet"
rust-version = "1.78"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Crypto / wallet primitives
bip39 = "2.0"
bitcoin = { version = "0.32", features = ["std", "rand-std", "secp-recovery"] }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context", "recovery"] }
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"        # keccak for Ethereum addresses
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
getrandom = "0.2"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
bs58 = "0.5"
bech32 = "0.11"
ripemd = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local crates
atlas-wallet-core = { path = "crates/wallet-core" }
atlas-chain-traits = { path = "crates/chain-traits" }
atlas-chain-bitcoin = { path = "crates/chain-bitcoin" }
atlas-chain-evm = { path = "crates/chain-evm" }
atlas-chain-solana = { path = "crates/chain-solana" }
atlas-chain-tron = { path = "crates/chain-tron" }
atlas-chain-cosmos = { path = "crates/chain-cosmos" }
atlas-chain-cardano = { path = "crates/chain-cardano" }
atlas-chain-utxo = { path = "crates/chain-utxo" }
atlas-price-oracle = { path = "crates/price-oracle" }
atlas-profile = { path = "crates/profile" }
atlas-settings = { path = "crates/settings" }
atlas-token-registry = { path = "crates/token-registry" }
atlas-nft-registry = { path = "crates/nft-registry" }
atlas-hardware-ledger = { path = "crates/hardware-ledger" }
atlas-exchange-1inch = { path = "crates/exchange-1inch" }

# Misc
uuid = { version = "1.10", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# Type generation (Rust → TypeScript IPC bindings)
specta = { version = "2.0.0-rc.24", features = ["derive", "uuid"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "2.0.0-rc.24", features = ["derive", "typescript"] }

# Local persistence
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
debug = true

